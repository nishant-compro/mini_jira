name: Run Jira coding agent
description: Run the validated Jira coding agent and model provider behind one interface

inputs:
  coding-agent:
    description: Validated coding agent (claude-code or codex)
    required: true
  model-provider:
    description: Validated model provider (bedrock or openrouter)
    required: true
  model:
    description: Validated provider-specific model identifier
    required: true
  mode:
    description: Invocation mode (implement or validate)
    required: false
    default: implement
  prompt:
    description: Trusted instruction that points the agent at sanitized task data
    required: true
  aws-role-arn:
    description: AWS role used for Bedrock
    required: false
    default: ""
  aws-region:
    description: AWS region used for Bedrock
    required: false
    default: ""
  openrouter-api-key:
    description: OpenRouter API key
    required: false
    default: ""
  role-session-name:
    description: AWS role session name
    required: false
    default: jira-agent

outputs:
  structured_output:
    description: Agent-neutral JSON summary matching summary.schema.json
    value: ${{ steps.claude.outputs.structured_output || steps.codex_openrouter.outputs['final-message'] || steps.codex_bedrock.outputs.structured_output }}
  execution_file:
    description: Path to the available execution evidence
    value: ${{ steps.claude.outputs.execution_file || steps.prepare.outputs.execution_file }}
runs:
  using: composite
  steps:
    - name: Prepare bounded agent arguments
      id: prepare
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        case "$MODE" in
          implement|validate) ;;
          *) echo "::error::Unsupported invocation mode"; exit 1 ;;
        esac

        summary_file="$RUNNER_TEMP/jira-agent-$MODE-summary.json"
        execution_file="$RUNNER_TEMP/jira-agent-$MODE-execution.jsonl"
        args_file="$RUNNER_TEMP/jira-agent-$MODE-claude-args"
        {
          printf -- '--model "%s"\n' "$MODEL"
          if [ "$MODE" = validate ]; then
            echo '--max-turns 2'
            echo '--max-budget-usd 1'
            echo '--disallowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash,WebFetch,WebSearch"'
          else
            echo '--max-turns 25'
            echo '--max-budget-usd 10'
            echo '--allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(git diff:*),Bash(git status:*),Bash(cd backend && bundle exec rspec:*),Bash(cd backend && bundle exec rubocop:*),Bash(cd frontend && npm ci),Bash(cd frontend && npm run build)"'
            echo '--disallowedTools "WebFetch,WebSearch,Bash(gh:*),Bash(git push:*),Bash(git commit:*),Bash(git merge:*),Bash(curl:*),Bash(wget:*)"'
          fi
          printf -- "--json-schema '%s'\n" "$(tr -d '\n' < "$GITHUB_ACTION_PATH/summary.schema.json")"
        } > "$args_file"

        delimiter="claude_args_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$MODE"
        {
          echo "claude_args<<$delimiter"
          cat "$args_file"
          echo "$delimiter"
          echo "summary_file=$summary_file"
          echo "execution_file=$execution_file"
          if [ "$MODE" = validate ]; then
            echo "codex_permission=:read-only"
            echo "codex_sandbox=read-only"
          else
            echo "codex_permission=:workspace"
            echo "codex_sandbox=workspace-write"
          fi
        } >> "$GITHUB_OUTPUT"

    - name: Prepare Node.js for Codex on Bedrock
      if: inputs.coding-agent == 'codex' && inputs.model-provider == 'bedrock'
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: "24"

    - name: Install pinned Codex CLI for Bedrock
      if: inputs.coding-agent == 'codex' && inputs.model-provider == 'bedrock'
      shell: bash
      run: npm install --global "@openai/codex@0.147.0"

    - name: Configure scoped AWS credentials
      id: aws
      if: inputs.model-provider == 'bedrock'
      uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ${{ inputs.role-session-name }}
        output-env-credentials: false
        output-credentials: true

    - name: Run Claude Code
      id: claude
      if: inputs.coding-agent == 'claude-code'
      uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        ANTHROPIC_BASE_URL: ${{ inputs.model-provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.model-provider == 'openrouter' && inputs.openrouter-api-key || '' }}
      with:
        anthropic_api_key: ${{ inputs.model-provider == 'openrouter' && inputs.openrouter-api-key || '' }}
        use_bedrock: ${{ inputs.model-provider == 'bedrock' && 'true' || 'false' }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.claude_args }}

    - name: Run Codex through OpenRouter
      id: codex_openrouter
      if: inputs.coding-agent == 'codex' && inputs.model-provider == 'openrouter'
      uses: openai/codex-action@7c168a233489ca36cb495409e8f1fba7b522bb40 # v1.11
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        openai-api-key: ${{ inputs.openrouter-api-key }}
        responses-api-endpoint: https://openrouter.ai/api/v1/responses
        prompt: ${{ inputs.prompt }}
        output-file: ${{ steps.prepare.outputs.execution_file }}
        output-schema-file: ${{ github.action_path }}/summary.schema.json
        model: ${{ inputs.model }}
        codex-version: 0.147.0
        permission-profile: ${{ steps.prepare.outputs.codex_permission }}
        safety-strategy: drop-sudo

    - name: Run Codex through Bedrock
      id: codex_bedrock
      if: inputs.coding-agent == 'codex' && inputs.model-provider == 'bedrock'
      shell: bash
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        CODEX_HOME: ${{ runner.temp }}/jira-agent-codex-home
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
        SANDBOX: ${{ steps.prepare.outputs.codex_sandbox }}
        SCHEMA_FILE: ${{ github.action_path }}/summary.schema.json
        SUMMARY_FILE: ${{ steps.prepare.outputs.summary_file }}
        EXECUTION_FILE: ${{ steps.prepare.outputs.execution_file }}
      run: |
        set -euo pipefail
        mkdir -p "$CODEX_HOME"
        printf '%s\n' "$PROMPT" | codex \
          -c 'model_provider="amazon-bedrock"' \
          -c 'approval_policy="never"' \
          -c "sandbox_mode=\"$SANDBOX\"" \
          -c 'shell_environment_policy.exclude=["AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_SESSION_TOKEN","ACTIONS_ID_TOKEN_REQUEST_TOKEN","ACTIONS_ID_TOKEN_REQUEST_URL"]' \
          exec \
          --strict-config \
          --model "$MODEL" \
          --json \
          --output-schema "$SCHEMA_FILE" \
          --output-last-message "$SUMMARY_FILE" \
          - | tee "$EXECUTION_FILE"
        jq -e '.summary | strings' "$SUMMARY_FILE" > /dev/null
        delimiter="codex_output_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        {
          echo "structured_output<<$delimiter"
          cat "$SUMMARY_FILE"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
