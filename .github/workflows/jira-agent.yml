name: Jira Agent

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key assigned to the AI agent
        required: true
        type: string
      event_id:
        description: Unique Jira Automation event identifier
        required: true
        type: string

concurrency:
  group: jira-agent-task-queue
  queue: max

permissions:
  contents: read

env:
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  admit:
    name: Validate assignment and assemble context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      duplicate: ${{ steps.context.outputs.duplicate }}
      issue_key: ${{ steps.context.outputs.issue_key }}
      base_sha: ${{ steps.config.outputs.base_sha }}
      coding_agent: ${{ steps.config.outputs.coding_agent }}
      model_provider: ${{ steps.config.outputs.model_provider }}
      implementer_model: ${{ steps.config.outputs.implementer_model }}
    steps:
      - name: Check out recorded main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        id: config
        shell: bash
        env:
          CODING_AGENT: ${{ vars.CODING_AGENT }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_AGENT_ACCOUNT_ID: ${{ vars.JIRA_AGENT_ACCOUNT_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_AGENT_API_TOKEN }}
          PR_BOT_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Jira dispatches must target main"
            exit 1
          fi
          for name in JIRA_BASE_URL JIRA_AGENT_ACCOUNT_ID JIRA_API_TOKEN PR_BOT_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Jira agent configuration $name is missing"
              exit 1
            fi
          done
          ruby .github/scripts/jira-agent/validate_runtime_config.rb
          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch and sanitize Jira context
        id: context
        env:
          ISSUE_KEY: ${{ inputs.issue_key }}
          EVENT_ID: ${{ inputs.event_id }}
          BASE_SHA: ${{ steps.config.outputs.base_sha }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_AGENT_ACCOUNT_ID: ${{ vars.JIRA_AGENT_ACCOUNT_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_AGENT_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_DUPLICATE: "true"
          POST_ACCEPTED: "true"
        run: ruby .github/scripts/jira-agent/fetch_context.rb .jira-agent

      - name: Upload sanitized context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jira-task-context
          path: .jira-agent/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  implement:
    name: Implement and publish
    needs: admit
    if: needs.admit.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    environment: jira-agent-runtime
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    outputs:
      passed: ${{ steps.final.outputs.passed }}
      branch: ${{ steps.final.outputs.branch }}
      pr_url: ${{ steps.final.outputs.pr_url }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.admit.outputs.base_sha }}
          persist-credentials: false

      - name: Download task context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jira-task-context
          path: .jira-agent

      - name: Print final sanitized agent context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in .jira-agent/task.md .jira-agent/metadata.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Expected agent context file $file is missing"
              exit 1
            fi
            echo "::group::$file"
            sed -n '1,$p' "$file"
            echo "::endgroup::"
          done

      - name: Prepare backend test dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          working-directory: backend
          bundler-cache: true

      - name: Prepare frontend test runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stage trusted patch validator outside the model worktree
        env:
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
        run: |
          set -euo pipefail
          verifier_dir="$RUNNER_TEMP/jira-agent-verifier"
          hooks_dir="$verifier_dir/hooks"
          mkdir -p "$hooks_dir"
          cp .github/scripts/jira-agent/validate_patch.rb "$verifier_dir/validate_patch.rb"
          cat > "$hooks_dir/pre-push" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          patch="$verifier_dir/pre-push.patch"
          git diff --binary --full-index "$BASE_SHA" -- . > "\$patch"
          ruby "$verifier_dir/validate_patch.rb" --already-applied "\$patch" > /dev/null
          EOF
          chmod 700 "$hooks_dir/pre-push"
          git config core.hooksPath "$hooks_dir"

      - name: Prepare trusted publication contract
        id: publication
        shell: bash
        env:
          ISSUE_KEY: ${{ needs.admit.outputs.issue_key }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
        run: |
          set -euo pipefail
          branch="ai/$(printf '%s' "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')-${GITHUB_RUN_ID}"
          jira_url="${JIRA_BASE_URL%/}/browse/${ISSUE_KEY}"
          jq -n \
            --arg issue_key "$ISSUE_KEY" \
            --arg branch "$branch" \
            --arg base_branch "main" \
            --arg base_sha "$BASE_SHA" \
            --arg jira_url "$jira_url" \
            --arg run_url "$RUN_URL" \
            '{
              issue_key: $issue_key,
              branch: $branch,
              base_branch: $base_branch,
              base_sha: $base_sha,
              jira_url: $jira_url,
              run_url: $run_url
            }' > .jira-agent/publication.json
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Implement ticket
        id: agent
        continue-on-error: true
        uses: ./.github/actions/run-jira-coding-agent
        with:
          coding-agent: ${{ needs.admit.outputs.coding_agent }}
          model-provider: ${{ needs.admit.outputs.model_provider }}
          model: ${{ needs.admit.outputs.implementer_model }}
          mode: implement
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          github-token: ${{ secrets.PR_BOT_TOKEN }}
          role-session-name: jira-agent-${{ github.run_id }}
          prompt: Implement the Jira ticket described in .jira-agent/task.md.

      - name: Clear any model credential residue
        if: always()
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_SECURITY_TOKEN="
            echo "AWS_CREDENTIAL_EXPIRATION="
            echo "ANTHROPIC_AUTH_TOKEN="
            echo "ANTHROPIC_API_KEY="
            echo "OPENROUTER_API_KEY="
            echo "CODEX_API_KEY="
            echo "CODEX_AUTH_JSON="
            echo "GH_TOKEN="
          } >> "$GITHUB_ENV"

      - name: Finalize implementation result and evidence
        id: final
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
          IMPLEMENT: ${{ steps.agent.outcome }}
          AGENT_OUTPUT: ${{ steps.agent.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          ISSUE_KEY: ${{ needs.admit.outputs.issue_key }}
          EXPECTED_BRANCH: ${{ steps.publication.outputs.branch }}
          PR_BOT_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        run: |
          set -euo pipefail
          passed=false
          published_branch=""
          published_pr_url=""
          publication_json=""

          if publication_json=$(GH_TOKEN="$PR_BOT_TOKEN" gh pr view "$EXPECTED_BRANCH" \
               --repo "$GITHUB_REPOSITORY" \
               --json title,body,headRefName,headRefOid,baseRefName,isDraft,state,url 2>/dev/null); then
            published_branch=$(printf '%s' "$publication_json" | jq -r '.headRefName // empty')
            published_pr_url=$(printf '%s' "$publication_json" | jq -r '.url // empty')
          fi

          if [ "$IMPLEMENT" = success ]; then
            mkdir -p candidate
            git add --intent-to-add --all
            if git diff --binary --full-index "$BASE_SHA" -- . > candidate/change.patch; then
              printf '%s\n' "$AGENT_OUTPUT" > candidate/summary.json
              if jq -e \
                 --arg issue "$ISSUE_KEY" \
                 --arg branch "$EXPECTED_BRANCH" \
                 --arg repo "$GITHUB_REPOSITORY" \
                 --arg jira "${JIRA_BASE_URL%/}/browse/${ISSUE_KEY}" \
                 --arg run "$RUN_URL" '
                   type == "object" and
                   (keys | sort == ["branch", "checks", "commit_message", "pr_body", "pr_title", "pr_url", "risks", "summary"]) and
                   (.summary | type == "string" and length > 0 and length <= 500) and
                   (.checks | type == "array" and all(.[]; type == "string" and length <= 240)) and
                   (.risks | type == "array" and all(.[]; type == "string" and length <= 240)) and
                   (.commit_message == .pr_title) and
                   (.pr_title | type == "string" and length <= 72 and startswith($issue + ": ") and (test("[`\\[\\]\\r\\n]") | not)) and
                   (.pr_body | type == "string" and length <= 1600 and startswith("## Summary\\n") and contains("\\n## Validation\\n") and contains("\\n## Risks\\n") and contains($jira) and contains($run)) and
                   (.branch == $branch) and
                   (.pr_url | type == "string" and startswith("https://github.com/" + $repo + "/pull/") and (split("/") | last | test("^[1-9][0-9]*$")))
                 ' candidate/summary.json > /dev/null &&
                 ruby "$RUNNER_TEMP/jira-agent-verifier/validate_patch.rb" --already-applied candidate/change.patch > /dev/null &&
                 [ "$(git branch --show-current)" = "$EXPECTED_BRANCH" ] &&
                 [ "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1 ] &&
                 [ "$(git log -1 --pretty=%s)" = "$(jq -r .commit_message candidate/summary.json)" ] &&
                 [ -n "$publication_json" ] &&
                 printf '%s' "$publication_json" | jq -e \
                   --arg local_head "$(git rev-parse HEAD)" \
                   --slurpfile expected candidate/summary.json '
                     .title == $expected[0].pr_title and
                     .body == $expected[0].pr_body and
                     .headRefName == $expected[0].branch and
                     .headRefOid == $local_head and
                     .baseRefName == "main" and
                     .isDraft == false and
                     .state == "OPEN" and
                     .url == $expected[0].pr_url
                   ' > /dev/null; then
                published_branch=$(jq -r .branch candidate/summary.json)
                published_pr_url=$(jq -r .pr_url candidate/summary.json)
                passed=true
              else
                echo "::error::Agent publication, output, or candidate patch failed trusted policy"
              fi
            fi
          fi

          if [ "$passed" = true ]; then
            artifact_name=candidate-ready
            artifact_path=candidate
          else
            artifact_name=implementation-failure-evidence
            artifact_path=.jira-agent/failure-package
            mkdir -p "$artifact_path/failure"
            git add --intent-to-add --all
            git diff --binary --full-index "$BASE_SHA" -- . > "$artifact_path/failure/change.patch"
            if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
              cp "$EXECUTION_FILE" "$artifact_path/failure/agent-execution.json"
            fi
            if [ -n "$AGENT_OUTPUT" ]; then
              printf '%s\n' "$AGENT_OUTPUT" > "$artifact_path/failure/summary.json"
            fi
          fi

          {
            echo "passed=$passed"
            echo "artifact_name=$artifact_name"
            echo "artifact_path=$artifact_path"
            echo "branch=$published_branch"
            echo "pr_url=$published_pr_url"
          } >> "$GITHUB_OUTPUT"

      - name: Upload candidate or failure evidence
        if: always() && steps.final.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.final.outputs.artifact_name }}
          path: ${{ steps.final.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Fail unsuccessful implementation stage
        if: always() && steps.final.outputs.passed != 'true'
        run: |
          echo "::error::Agent implementation failed or did not produce a safe publishable patch"
          exit 1

      - name: Update Jira with publication links
        if: steps.final.outputs.passed == 'true'
        env:
          ISSUE_KEY: ${{ needs.admit.outputs.issue_key }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_AGENT_API_TOKEN }}
          JIRA_COMMENT: "AI branch ${{ steps.final.outputs.branch }} published as ${{ steps.final.outputs.pr_url }}. Full CI and human review are pending. Run: ${{ env.RUN_URL }}"
        run: ruby .github/scripts/jira-agent/comment.rb

  report-failure:
    name: Notify Jira of workflow failure
    needs: [admit, implement]
    if: always() && needs.admit.outputs.duplicate != 'true' && (needs.admit.result != 'success' || needs.implement.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notification helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.admit.outputs.base_sha || github.sha }}
          persist-credentials: false
      - name: Notify Jira
        env:
          ISSUE_KEY: ${{ needs.admit.outputs.issue_key || inputs.issue_key }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_AGENT_API_TOKEN }}
          ADMIT_RESULT: ${{ needs.admit.result }}
          IMPLEMENT_RESULT: ${{ needs.implement.result }}
          IMPLEMENT_PASSED: ${{ needs.implement.outputs.passed }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          PR_URL: ${{ needs.implement.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [ "$ADMIT_RESULT" != success ]; then
            message="AI workflow admission failed, possibly because Jira or GitHub could not be reached. Implementation was not started. Run: $RUN_URL"
          elif [ -n "$PR_URL" ]; then
            message="AI implementation created $PR_URL, but trusted post-publication validation or a later step failed. Do not merge until the failed run is reviewed. Run: $RUN_URL"
          elif [ -n "$BRANCH" ]; then
            message="AI branch $BRANCH was pushed, but pull-request creation or a later step failed. Check partial publication state before retrying. Run: $RUN_URL"
          elif [ "$IMPLEMENT_PASSED" != true ]; then
            message="AI implementation failed before publishing a pull request. Model output and the candidate patch are retained on $RUN_URL."
          else
            message="AI implementation completed, but no branch or pull request was recorded. Run: $RUN_URL"
          fi
          export JIRA_COMMENT="$message"
          for attempt in 1 2 3; do
            if ruby .github/scripts/jira-agent/comment.rb; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Unable to notify Jira after three attempts"
          exit 1
